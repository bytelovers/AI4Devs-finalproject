<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- FOUC Prevention: synchronously read localStorage and prefers-color-scheme
         before any stylesheet is parsed so the correct class is set on <html>
         before first paint. Must remain inline and before stylesheet links. -->
    <script>
      (function() {
        var theme = localStorage.getItem('theme') || 'system';
        if (
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- SEO Meta Tags -->
    <title>SplitEat - Divide la Cuenta de Restaurante Fácil y al Céntimo</title>
    <meta name="description" content="Saca una foto a tu ticket de restaurante y divide la cuenta de forma equitativa y rápida entre tus amigos. Totalmente offline-first y sin registros obligatorios." />
    <meta name="theme-color" content="#5F8575" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="SplitEat - División Inteligente de Cuentas" />
    <meta property="og:description" content="Divide cuentas de restaurantes al céntimo escaneando el ticket. Sin descargas obligatorias, offline-first y con redondeo inteligente." />
    <meta property="og:type" content="website" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
